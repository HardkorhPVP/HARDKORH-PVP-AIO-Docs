# HARDKORH PVP AIO - public product documentation
# Jekyll + Minimal Mistakes as a GitHub Pages remote theme (no theme source is copied into this repository).

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "dark"

locale: "en-US"
title: "HARDKORH PVP AIO"
title_separator: "|"
subtitle: "Intelligent PvP for World of Warcraft"
name: "HardkorhPVP"
description: "Documentation for HARDKORH PVP AIO: the HARDKORH PvP intelligence platform and its class packs for World of Warcraft: Midnight on Project Sylvanas. HARDKORH Druid: Feral and Balance."
copyright: "HardkorhPVP"
# The footer copyright name links here (the theme's default is site.url, the organization root, which has no site).
copyright_url: "https://hardkorhpvp.github.io/HARDKORH-PVP-AIO-Docs/"
masthead_title: "HARDKORH PVP AIO"
# Masthead brand: the HARDKORH PVP AIO wordmark image (its alt text is masthead_title); the text title is hidden in main.scss.
logo: "/assets/images/brand/hardkorh-wordmark.png"

# GitHub Pages project site of HardkorhPVP/HARDKORH-PVP-AIO-Docs. Every internal link uses relative_url / absolute_url;
# local preview serves the site under the same /HARDKORH-PVP-AIO-Docs/ path.
url: "https://hardkorhpvp.github.io"
baseurl: "/HARDKORH-PVP-AIO-Docs"

breadcrumbs: false
search: true
search_full_content: true
search_provider: lunr

# Product documentation, not a blog: no feeds, comments, analytics, sharing, dates or author profile.
atom_feed:
  hide: true
comments:
  provider: false
analytics:
  provider: false

og_image: "/assets/images/brand/hardkorh-banner-1200x300.png"

footer:
  links:
    - label: "Discord"
      icon: "fab fa-fw fa-discord"
      url: "https://discord.gg/sv2WNwk2WZ"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 2..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

include:
  - _pages
exclude:
  - README.md
  - HEADER_VISUAL_MANIFEST.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .gitignore

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
      show_date: false
      toc: false
      sidebar:
        nav: "docs"
  # Page headers (decorative only). Every page has its own header composition: hk-hdr--<page> selects that page's art crop
  # and treatment in assets/css/main.scss; hk-art--quiet gives the restrained pages a shorter, quieter card. Page content and
  # the real screenshots are unchanged. HEADER_VISUAL_MANIFEST.md lists every composition; keep them unique.
  - scope: { path: "_pages/getting-started-requirements.md" }
    values: { classes: [hk-art, hk-hdr--requirements, hk-art--quiet] }
  - scope: { path: "_pages/getting-started-installation.md" }
    values: { classes: [hk-art, hk-hdr--installation, hk-art--quiet] }
  - scope: { path: "_pages/getting-started-first-launch.md" }
